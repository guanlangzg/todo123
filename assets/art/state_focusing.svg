    <circle cx="26" cy="194" r="1.6"/><circle cx="58" cy="202" r="1.6"/><circle cx="134" cy="120" r="1.6"/>
    <circle cx="16" cy="140" r="1.6"/><circle cx="126" cy="64" r="1.6"/>
