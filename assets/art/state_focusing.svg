  <path d="M111.5 120.4A42 42 0 1 1 57.6 66.5" fill="none" stroke="#5E9993" stroke-width="5" stroke-linecap="round"/>
  <path d="M50.6 124A28 28 0 1 1 86 130.2" fill="none" stroke="#1F6B63" stroke-width="5" stroke-linecap="round"/>
  <circle cx="72" cy="106" r="13" fill="#1F6B63"/>

  <!-- 层 2：落沙 -->
  <circle cx="104" cy="170" r="4" fill="#5E9993"/>
  <circle cx="118" cy="182" r="4" fill="#5E9993"/>
  <circle cx="132" cy="192" r="4" fill="#A2C8C2"/>
  <path d="M100 158 116 168" fill="none" stroke="#5E9993" stroke-width="3" stroke-linecap="round"/>

