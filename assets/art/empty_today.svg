<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 656 320" width="656" height="320">
  <!-- empty_today — 空态：空画架＋一张待写的纸。原创矢量插画，见 docs/设计/素材权利清单.md -->
  <rect id="bg" x="0" y="0" width="656" height="320" fill="#EFE8DB"/>

  <!-- 层 1：墙面场（下边界收在 y=128，即底部 96dp 文字安全区顶边） -->
  <rect id="wall" x="0" y="0" width="656" height="128" fill="#2F5D8C"/>
  <rect id="wallShift" x="0" y="118" width="656" height="10" fill="#25517B"/>
  <rect id="floor" x="0" y="128" width="656" height="192" fill="#F5F0E8"/>

  <!-- 图形组整体上移，使深色轮廓全部收在 y<128（底部 96dp 文字安全区上方） -->
  <g transform="translate(0,-14)">
  <!-- 层 2：画架 -->
  <path d="M300 132 330 14" fill="none" stroke="#7A5410" stroke-width="6" stroke-linecap="round"/>
  <path d="M210 132 176 14" fill="none" stroke="#7A5410" stroke-width="6" stroke-linecap="round"/>
  <path d="M372 132 406 14" fill="none" stroke="#7A5410" stroke-width="6" stroke-linecap="round"/>
  <path d="M186 108H500" fill="none" stroke="#7A5410" stroke-width="6" stroke-linecap="round"/>

  <!-- 层 3：待写的纸 -->
  <rect x="214" y="24" width="156" height="84" fill="#FFFFFF" stroke="#192C3B" stroke-width="4"/>
  <path d="M236 56h112M236 76h112M236 96h64" fill="none" stroke="#5F6E78"
        stroke-width="3" stroke-linecap="round"/>

  <!-- 层 4：笔与光点 -->
  <path d="M420 106 500 88" fill="none" stroke="#B64931" stroke-width="9" stroke-linecap="round"/>
  <path d="M500 88 518 84 508 98Z" fill="#EFE8DB" stroke="#192C3B" stroke-width="3"/>
  <circle cx="566" cy="46" r="24" fill="#D8B267"/>
  </g>

  <!-- 丝网颗粒：只在墙面色块内部 -->
  <g id="grain" fill="#25517B" opacity="0.4">
    <circle cx="40" cy="30" r="1.7"/><circle cx="92" cy="76" r="1.7"/><circle cx="140" cy="26" r="1.7"/>
    <circle cx="100" cy="118" r="1.7"/><circle cx="188" cy="60" r="1.7"/><circle cx="248" cy="14" r="1.7"/>
    <circle cx="452" cy="30" r="1.7"/><circle cx="500" cy="76" r="1.7"/><circle cx="612" cy="34" r="1.7"/>
    <circle cx="640" cy="98" r="1.7"/><circle cx="436" cy="118" r="1.7"/><circle cx="352" cy="16" r="1.7"/>
  </g>
</svg>
