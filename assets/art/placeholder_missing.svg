<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 216 216" width="216" height="216">
  <!-- placeholder_missing — 退化视觉：被撕去一角的纸。原创矢量插画，见 docs/设计/素材权利清单.md -->
  <rect id="bg" x="0" y="0" width="216" height="216" fill="#EFE8DB"/>

  <!-- 层 1：缺角的纸 -->
  <path d="M40 66 62 44H132V172H40Z" fill="#FFFFFF" stroke="#192C3B" stroke-width="4"/>

  <!-- 层 2：撕去那一角的残留轮廓 -->
  <path d="M40 44h22M40 44v22" fill="none" stroke="#7F8A92" stroke-width="3" stroke-linecap="round"/>

  <!-- 层 3：撕口纤维 -->
  <path d="M46 60 40 56M52 54 48 47M58 48 55 42" fill="none" stroke="#5F6E78"
        stroke-width="2.5" stroke-linecap="round"/>

  <!-- 层 4：纸上的字迹残留 -->
  <path d="M56 92h60M56 112h60M56 132h44M56 152h28" fill="none" stroke="#7F8A92"
        stroke-width="3" stroke-linecap="round"/>

  <!-- 丝网颗粒：只在纸面内部，右侧 24dp 静区保持平整 -->
  <g id="grain" fill="#7F8A92" opacity="0.3">
    <circle cx="20" cy="36" r="1.6"/><circle cx="16" cy="120" r="1.6"/><circle cx="24" cy="196" r="1.6"/>
    <circle cx="66" cy="204" r="1.6"/><circle cx="120" cy="204" r="1.6"/><circle cx="128" cy="36" r="1.6"/>
    <circle cx="96" cy="200" r="1.6"/><circle cx="134" cy="152" r="1.6"/>
  </g>
</svg>
