<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 216 216" width="216" height="216">
  <!-- state_completed — 完成态：合上的本子＋朱砂印。原创矢量插画，见 docs/设计/素材权利清单.md -->
  <rect id="bg" x="0" y="0" width="216" height="216" fill="#EFE8DB"/>

  <!-- 层 1：书页与封面 -->
  <rect x="118" y="62" width="14" height="112" fill="#F5F0E8" stroke="#192C3B" stroke-width="4"/>
  <path d="M118 66h14M118 88h14M118 110h14M118 132h14M118 154h14" fill="none"
        stroke="#7F8A92" stroke-width="2.5"/>
  <rect x="22" y="62" width="98" height="112" fill="#2F5D8C" stroke="#192C3B" stroke-width="4"/>
  <rect x="22" y="62" width="16" height="112" fill="#25517B" stroke="#192C3B" stroke-width="4"/>

  <!-- 层 2：书脊压线与书名条 -->
  <path d="M56 84h48M56 100h40" fill="none" stroke="#8FB4DC" stroke-width="3" stroke-linecap="round"/>
  <path d="M56 122h48M56 138h30" fill="none" stroke="#8FB4DC" stroke-width="3" stroke-linecap="round"/>

  <!-- 层 3：书签带 -->
  <path d="M86 62v-22l10 8 10-8v22" fill="#D8B267" stroke="#192C3B" stroke-width="4"/>

  <!-- 层 4：朱砂印 -->
  <circle cx="96" cy="158" r="22" fill="#B64931" stroke="#192C3B" stroke-width="4"/>
  <rect x="86" y="148" width="20" height="20" fill="none" stroke="#FFFFFF" stroke-width="4"/>

  <!-- 丝网颗粒：只落在封面色块内部，右侧 24dp 静区保持平整 -->
  <g id="grain" fill="#25517B" opacity="0.5">
    <circle cx="46" cy="76" r="1.6"/><circle cx="72" cy="70" r="1.6"/><circle cx="104" cy="78" r="1.6"/>
    <circle cx="46" cy="112" r="1.6"/><circle cx="108" cy="116" r="1.6"/><circle cx="46" cy="152" r="1.6"/>
    <circle cx="112" cy="160" r="1.6"/><circle cx="20" cy="40" r="1.6"/><circle cx="136" cy="44" r="1.6"/>
    <circle cx="20" cy="196" r="1.6"/><circle cx="70" cy="200" r="1.6"/><circle cx="126" cy="196" r="1.6"/>
  </g>
</svg>
